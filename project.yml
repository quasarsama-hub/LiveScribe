name: LiveScribe
options:
  bundleIdPrefix: dev.livescribe
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  LiveScribe:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: LiveScribe
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: LiveScribe
        PRODUCT_BUNDLE_IDENTIFIER: dev.livescribe.app
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/LiveScribe.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: LiveScribeBroadcast
  LiveScribeBroadcast:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Broadcast
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: LiveScribeBroadcast
        PRODUCT_BUNDLE_IDENTIFIER: dev.livescribe.app.broadcast
        INFOPLIST_FILE: Config/Broadcast-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Broadcast.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
